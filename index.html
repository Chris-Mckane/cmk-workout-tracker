<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMK Workout Tracker</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CMK Workouts">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app">
    <img src="icon.svg" alt="" width="34" height="34">
    <strong class="grow">CMK Workout Tracker</strong>
    <button class="ghost" data-home>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>
      Home
    </button>
  </header>
  <main>
    <div id="notice"></div>
    <section id="session" hidden></section>
    <section id="workouts" hidden></section>
    <section id="daily" hidden></section>
    <section id="week" hidden></section>
  </main>
  <nav aria-label="Main">
    <button data-tab="session">Session</button>
    <button data-tab="workouts">Workouts</button>
    <button data-tab="daily">Daily</button>
    <button data-tab="week">Week</button>
  </nav>
  <div id="tip" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
