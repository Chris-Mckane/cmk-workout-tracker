<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMK-GymApp</title>
  <meta name="theme-color" content="#0b1218">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CMK-GymApp">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="cmk-gymapp-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app">
    <img src="icon.svg" alt="" width="34" height="34">
    <strong class="grow">CMK-GymApp</strong>
    <button class="ghost" data-settings aria-label="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.34 3.34" stroke-width="3"/><circle cx="12" cy="12" r="5.5"/></svg>
    </button>
  </header>
  <main>
    <div id="notice"></div>
    <section id="home" hidden></section>
    <section id="session" hidden></section>
    <section id="workouts" hidden></section>
    <section id="daily" hidden></section>
    <section id="summary" hidden></section>
  </main>
  <nav aria-label="Main">
    <button data-tab="home">Home</button>
    <button data-tab="session">Workout</button>
    <button data-tab="summary">Summary</button>
  </nav>
  <div id="tip" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
